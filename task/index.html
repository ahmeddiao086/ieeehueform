<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>مهمة التقديم | IEEE Horus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f7fb; --card:#fff; --ink:#14213d; --muted:#5d6b82;
    --primary:#00629b; --primary-dark:#004a75; --accent:#f5a623;
    --line:#dde5f0; --danger:#c0392b; --ok:#1e8e5a; --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.9}
  header{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;padding:28px 16px 64px;text-align:center}
  header h1{margin:0;font-size:1.6rem;font-weight:800}
  header p{margin:6px 0 0;opacity:.85}
  main{max-width:760px;margin:-40px auto 48px;padding:0 16px}
  .card{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:0 8px 28px rgba(20,33,61,.08);margin-bottom:18px}
  .card h2{margin:0 0 6px;font-size:1.25rem}
  .badge{display:inline-block;background:#e6f2fa;color:var(--primary);padding:2px 14px;border-radius:99px;font-weight:700;font-size:.9rem}
  .notice{background:#fff8e8;border:1px solid #f6dfa8;border-radius:12px;padding:12px 16px;font-size:.95rem;margin-top:10px}
  .notice.blue{background:#eef6fc;border-color:#cfe4f3}

  .brief{background:#f8fbfe;border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin:18px 0 4px}
  .brief[dir=ltr]{text-align:left}
  .brief h3{margin:14px 0 4px;font-size:1.05rem;color:var(--primary-dark)}
  .brief h3:first-child{margin-top:0}
  .brief p{margin:6px 0}
  .brief ul,.brief ol{margin:6px 0;padding-inline-start:24px}
  .brief li{margin:2px 0}
  .brief figure{margin:12px 0 4px}
  .brief figure img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
  .brief figcaption{color:var(--muted);font-size:.85rem;margin-top:6px}
  .iconlinks{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 2px}
  .iconlink{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--primary);color:var(--primary);background:#fff;border-radius:12px;padding:6px 14px;text-decoration:none;font-weight:700;font-size:.92rem}
  .iconlink:hover{background:var(--primary);color:#fff}
  .iconlink svg{width:20px;height:20px;flex:none}
  .iconlink.off{border-color:var(--line);color:var(--muted);cursor:not-allowed;background:#f4f6f9}
  .iconlink.off:hover{background:#f4f6f9;color:var(--muted)}

  label.q{display:block;font-weight:700;margin:22px 0 4px}
  .hint{color:var(--muted);font-size:.88rem;margin:0 0 8px}
  textarea,input[type=url],input[type=text]{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fbfdff}
  textarea{min-height:110px;resize:vertical}
  textarea:focus,input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,98,155,.15)}
  .count{font-size:.8rem;color:var(--muted);text-align:left}
  .roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
  .role{border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff;text-align:right;font:inherit;transition:.15s}
  .role:hover{border-color:var(--primary);transform:translateY(-2px)}
  .role b{display:block;font-size:1.05rem}
  .role span{color:var(--muted);font-size:.88rem}
  .btn{background:var(--primary);color:#fff;border:0;border-radius:12px;padding:14px 28px;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;width:100%;margin-top:18px}
  .btn:hover{background:var(--primary-dark)}
  .btn:disabled{opacity:.6;cursor:wait}
  .link{background:none;border:0;color:var(--primary);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
  .decl{display:flex;gap:10px;align-items:flex-start;margin-top:24px;background:#f1f7fc;border-radius:12px;padding:14px}
  .decl input{margin-top:8px;width:18px;height:18px}
  .err{color:var(--danger);font-weight:600;margin-top:12px}
  .center{text-align:center;padding:40px 20px}
  .center .big{font-size:3rem}
  .ok{color:var(--ok)}
  .spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 12px}
  @keyframes s{to{transform:rotate(360deg)}}
  .savebar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 18px;border-radius:99px;font-size:.85rem;box-shadow:0 6px 18px rgba(0,0,0,.2);display:none;z-index:9;white-space:nowrap}
  .savebar.ok{background:var(--ok)}
  .savebar.warn{background:#b9770e}
  footer{text-align:center;color:var(--muted);font-size:.85rem;padding-bottom:70px}
</style>
</head>
<body>
<header>
  <h1>IEEE Horus Student Branch</h1>
  <p>مهمة التقديم إلى اللجان</p>
</header>
<main id="app"></main>
<div class="savebar" id="savebar"></div>
<footer>© IEEE Horus Student Branch</footer>

<script>
/* ===================== الإعدادات ===================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyA-v_eqGm6on8A8uctQe7P3M71m9VlcvQ_f9jvZuW6GSFYQlNb_O0zW1-Jje5l0fSf1w/exec';
const AUTOSAVE_DELAY_MS = 2500;
const DEADLINE_TEXT = ''; // مثال: 'آخر موعد للتسليم: الأحد 8 نوفمبر، الساعة 11:59 مساءً'

const IEEE_DAY_INSTAGRAM = 'https://www.instagram.com/ieeeday/';
const RESOURCES_URL = 'https://drive.google.com/drive/folders/16fu1NxAsXUeMGq2lsmXsqUasV-fGyLQK?usp=sharing'; // مجلد المصادر (ويضم شعار IEEE Horus SB)

/* ===================== الروابط المسموحة ===================== */
const HOSTS = {
  drive:     ['drive.google.com','docs.google.com'],
  portfolio: ['drive.google.com','docs.google.com','behance.net'],
  form:      ['forms.gle','docs.google.com','forms.office.com','forms.microsoft.com','forms.cloud.microsoft']

const HOST_MSG = {
  drive:     'يجب أن يكون الرابط من Google Drive.',
  portfolio: 'يجب أن يكون الرابط من Google Drive أو Behance.',
  form:      'يجب أن يكون الرابط لنموذج Google Forms أو Microsoft Forms.'

const SHARE_HINT = 'تأكّد من ضبط المشاركة على «أي شخص لديه الرابط» (Anyone with the link) بصلاحية عارض (Viewer)، وإلا لن نتمكّن من فتح الملف.';

/* ===================== أدوات تعريف الحقول ===================== */
const pdfField = (id, label, extra) => Object.assign({id, type:'link', hosts:'drive', required:true, logo:true, label,
  hint:'اكتب إجابتك في ملف PDF، وارفعه إلى Google Drive، ثم ألصق رابطه هنا. ' + SHARE_HINT}, extra || {});

const textField = (id, label, o) => Object.assign({id, type:'text', required:true, min:0, label}, o || {});

/* ===================== المهام ===================== */
const COMMITTEES = {
  pr:{ label:'العلاقات العامة (PR)', sections:[{ blocks:[
      {t:'p', text:'في كل عام ينظّم فرع IEEE Horus فعالية تقنية كبيرة داخل الجامعة، ويجذب عددًا كبيرًا من الطلاب والمهتمين بالتكنولوجيا. لكن هذا العام واجه الفريق مشكلة، وهي أن الحضور كان منخفضًا مقارنةً بالأعوام السابقة. وعندما بدأنا البحث عن السبب، وجدنا أن كثيرًا من الطلاب لم يكونوا يعرفون موعد الفعالية أو تفاصيلها، رغم أننا نشرنا عنها على صفحات IEEE في وسائل التواصل الاجتماعي.'},

      {t:'ol', items:[
        'تحليل الأسباب: ما السبب الرئيسي المحتمل لعدم علم الطلاب بالفعالية؟',

        'التواصل مع الجمهور: كيف ستتعامل مع آراء الطلاب الذين لم يحضروا؟ وكيف ستقنعهم بحضور الفعاليات القادمة؟']}
    ], fields:[ pdfField('answer','رابط ملف PDF الذي يتضمّن إجاباتك', {hint:'اكتب إجاباتك باللغة العربية في ملف PDF، وارفعه إلى Google Drive، ثم ألصق رابطه هنا. ' + SHARE_HINT}) ]}]},

      {t:'ol', items:[

    ], fields:[ pdfField('answer','رابط ملف PDF الذي يتضمّن إجاباتك', {hint:'اكتب إجاباتك باللغة العربية في ملف PDF، وارفعه إلى Google Drive، ثم ألصق رابطه هنا. ' + SHARE_HINT}) ]}]},

  membership:{ label:'العضوية', sections:[
    { blocks:[
      {t:'h', text:'السؤال الأول: تسجيل المشاركين في الفعاليات'},
      {t:'p', text:'لنفترض أن الفرع ينظم فعالية داخل الجامعة، وقد أبدى عدد كبير من الطلاب اهتمامهم بالمشاركة وسجّلوا لحضورها.'},
      {t:'p', text:'المطلوب: إنشاء نموذج تسجيل باستخدام Google Forms أو Microsoft Forms لجمع بيانات الطلاب الراغبين في حضور الفعالية.'},

      {t:'ul', items:['الاسم بالكامل.','الكود الجامعي.','رقم الهاتف.','البريد الإلكتروني.']},
      {t:'h', text:'ثانيًا: بيانات اختيارية'},
      {t:'ul', items:['ماذا تعرف عن IEEE Horus Student Branch؟']},

    ], fields:[ {id:'form', type:'link', hosts:'form', required:true, label:'رابط نموذج التسجيل (Google Forms أو Microsoft Forms)',
        hint:'تأكّد من أن النموذج يقبل الردود، وأن الرابط يفتح لأي شخص لديه الرابط دون تسجيل دخول.'} ]},
    { blocks:[
      {t:'h', text:'السؤال الثاني: تنظيم الحضور (Attendance Management)'},
      {t:'p', text:'بعد تسجيل عدد كبير من الطلاب، كيف ستنظم عملية تسجيل الحضور يوم الفعالية لتجنب التكدس والازدحام أمام نقاط التسجيل؟'},
      {t:'p', text:'المطلوب: اشرح خطتك لتنظيم دخول الطلاب، والتحقق من بياناتهم، وتسجيل حضورهم بطريقة سريعة ومنظمة تضمن انسيابية الدخول.'}
    ], fields:[
      pdfField('attendance','رابط ملف PDF الذي يتضمّن خطتك لتنظيم الحضور'),
      textField('office','هل لديك خبرة في برامج Microsoft Office؟', {rows:2, hint:'يمكنك الإجابة بـ «نعم» أو بتفصيل أكثر، ولا يوجد حدّ أدنى للطول.'}) ]},

      {t:'ol', items:[

      {t:'h', text:'السؤال الأول: التعامل مع الطوارئ'},

      {t:'h', text:'السؤال الثاني: إدارة المشكلات داخل القاعة'},

      {t:'p', text:'حاولت التعامل معه وطلبت منه الهدوء أكثر من مرة، ولكنه استمر في التصرف نفسه ولم يستجب.'},
      {t:'p', text:'كيف ستتعامل مع هذا الموقف؟ وما الإجراء الذي ستتخذه للحفاظ على النظام داخل القاعة دون التأثير على سير المحاضرة؟'}
    ], fields:[ pdfField('answer','رابط ملف PDF الذي يتضمّن إجاباتك') ]}]},

    ], fields:[ pdfField('answer','رابط ملف PDF الذي يتضمّن إجاباتك') ]}]},

const SOCIAL_ROLES = {

      textField('gd_tools','الأدوات والبرامج التي استخدمتها في التصميم', {rows:3, hint:'اذكرها في سطر أو أكثر.'}),
      {id:'gd_portfolio', type:'link', hosts:'portfolio', required:false, label:'رابط أعمال سابقة (Portfolio)', hint:'اختياري: رابط Google Drive أو Behance.'} ]}]},

      {t:'p', text:'ارفع عيّنات من أعمالك السابقة في التعليق الصوتي (Voice Over)، وأرفق رابط Google Drive الذي يضم هذه العيّنات.'}
    ], fields:[ driveField('vo_samples','رابط عيّنات التعليق الصوتي (Google Drive)', 'يمكنك وضع العيّنات في مجلد واحد وإرفاق رابط المجلد.') ]}]},

  writer:{ label:'كتابة المحتوى', desc:'سيناريو وكتابة إبداعية', sections:[{ blocks:[
      {t:'p', text:'اكتب سيناريو (Script) لفيديو ترويجي لفرع IEEE Horus Student Branch.'},
      {t:'p', text:'هدف الفيديو هو التعريف بالفرع والترويج له داخل جامعة حورس، سواء كان الفيديو موشن جرافيك أو فيديو حيًّا (Live Action) كاملًا.'}
    ], fields:[ pdfField('cw_script','رابط ملف PDF الذي يتضمّن السيناريو', {hint:'اكتب السيناريو في ملف PDF، وارفعه إلى Google Drive، ثم ألصق رابطه هنا. ' + SHARE_HINT}) ]}]}
};

/* ===================== الحالة ===================== */
const app = document.getElementById('app');
const savebar = document.getElementById('savebar');
const state = {
  code:'', info:null, role:null, fields:null, values:{},
  dirty:false, saving:false, again:false, timer:null, submitting:false,
  pasteCount:0, pasteChars:0
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show = html => { app.innerHTML = html; window.scrollTo({top:0,behavior:'smooth'}); };
const msg = (icon, title, text, cls='') => { setStatus(''); show(`<div class="card center"><div class="big ${cls}">${icon}</div><h2>${title}</h2><p>${text}</p></div>`); };

function setStatus(text, cls=''){
  if(!text){ savebar.style.display = 'none'; return; }
  savebar.textContent = text; savebar.className = 'savebar ' + cls; savebar.style.display = 'block';
}

/* ===================== المسودة (محلية + على الخادم) ===================== */
const localKey = () => 'horus_draft_v2_' + state.code;
function loadLocal(){ try{ return JSON.parse(localStorage.getItem(localKey()) || 'null'); }catch(e){ return null; } }
function saveLocal(synced){
  try{ localStorage.setItem(localKey(), JSON.stringify({role:state.role, values:state.values, synced:!!synced})); }catch(e){}
}
function clearLocal(){ try{ localStorage.removeItem(localKey()); }catch(e){} }

function collectValues(){
  if(!state.fields) return;
  state.fields.forEach(f => {
    const el = document.getElementById('f_' + f.id);
    if(el) state.values[f.id] = el.value;
  });
}

function onEdit(){
  collectValues();
  state.dirty = true;
  saveLocal(false);
  setStatus('جارٍ حفظ المسودة…');
  clearTimeout(state.timer);
  state.timer = setTimeout(saveRemote, AUTOSAVE_DELAY_MS);
}

function draftBody(){
  return JSON.stringify({action:'saveDraft', code:state.code, role:state.role, values:state.values});
}

async function saveRemote(){
  if(state.submitting) return;
  if(state.saving){ state.again = true; return; }
  if(!state.dirty) return;
  state.saving = true; state.dirty = false;
  try{
    const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:draftBody()});
    const res = await r.json();
    if(res.ok){
      if(!state.dirty) saveLocal(true);
      setStatus('تم حفظ المسودة تلقائيًّا ✓', 'ok');
    }else if(res.error === 'already'){
      clearLocal(); state.submitting = true;
      return msg('✅','تم استلام مهمتك مسبقًا','لا يمكن إرسال أكثر من إجابة واحدة.','ok');
    }else{
      throw new Error(res.error || 'save');
    }
  }catch(e){
    state.dirty = true;
    setStatus('تعذّر الحفظ على الخادم، والمسودة محفوظة على هذا الجهاز.', 'warn');
    clearTimeout(state.timer);
    state.timer = setTimeout(saveRemote, 8000);
  }
  state.saving = false;
  if(state.again){ state.again = false; saveRemote(); }
}

function flush(){
  if(!state.fields || state.submitting) return;
  collectValues(); saveLocal(false);
  if(state.dirty){
    try{
      const body = draftBody();
      if(body.length < 60000) fetch(API_URL, {method:'POST', keepalive:true, headers:{'Content-Type':'text/plain;charset=utf-8'}, body});
    }catch(e){}
  }
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') flush(); });
window.addEventListener('pagehide', flush);

/* ===================== التهيئة ===================== */
async function init(){
  const m = location.pathname.match(/^\/task\/([A-Za-z0-9]+)\/?$/);
  state.code = m ? m[1] : '';
  if(!state.code) return msg('🔒','الرابط غير صحيح','يرجى فتح الموقع من الرابط الشخصي الذي أُرسل إليك.');
  show('<div class="card center"><div class="spin"></div><p>جارٍ التحميل…</p></div>');
  try{
    const r = await fetch(API_URL + '?action=lookup&code=' + encodeURIComponent(state.code));
    state.info = await r.json();
  }catch(e){ return msg('⚠️','تعذّر الاتصال','يرجى تحديث الصفحة بعد قليل.'); }
  if(!state.info.ok) return msg('🔒','الرابط غير صحيح','تأكّد من نسخ الرابط كاملًا، وإن استمرت المشكلة فتواصل مع اللجنة.');
  if(state.info.submitted){ clearLocal(); return msg('✅','تم استلام مهمتك','شكرًا لك، سنتواصل معك بعد مراجعة المهام جميعها. لا يمكن إرسال أكثر من إجابة.','ok'); }
  if(!COMMITTEES[state.info.committee]) return msg('⚠️','مشكلة في بياناتك','يرجى التواصل مع اللجنة لمراجعتها.');

  // استعادة المسودة: المحلية إن كانت تحمل تعديلات لم تُرسَل، وإلا مسودة الخادم
  const local = loadLocal();
  const server = state.info.draft;
  const pick = (local && local.synced === false) ? local : (server || local);
  if(pick){ state.values = pick.values || {}; state.role = pick.role || null; }

  if(state.info.committee === 'social' && !(state.role && SOCIAL_ROLES[state.role])) { state.role = null; renderRoles(); }
  else renderForm();
}

function intro(){
  const hi = state.info.name ? `أهلًا بك يا ${esc(state.info.name)} 👋` : 'أهلًا بك 👋';
  return `<div class="card"><span class="badge">${esc(COMMITTEES[state.info.committee].label)}</span>
    <h2 style="margin-top:10px">${hi}</h2>
    <div class="notice">✍️ يجب أن تكون الإجابات من صياغتك أنت. يُسمح باستخدام الذكاء الاصطناعي مصدرًا للأفكار فقط، لا لكتابة الإجابة ولا لإنتاج العمل.
    ${DEADLINE_TEXT ? '<br>⏰ ' + esc(DEADLINE_TEXT) : ''}</div>
    <div class="notice blue">💾 تُحفَظ إجاباتك تلقائيًّا، ويمكنك العودة إلى الرابط نفسه لإكمالها في أي وقت قبل الإرسال. بعد الضغط على «إرسال المهمة» لا يمكن تعديل الإجابة ولا إرسال إجابة أخرى.</div></div>`;
}

function renderRoles(){
  show(intro() + `<div class="card"><h2>اختر تخصصك في السوشيال ميديا</h2>
    <p class="hint">لكل تخصص مهمة مختلفة، فاختر الأقرب إلى مهاراتك.</p>
    <div class="roles">` + Object.entries(SOCIAL_ROLES).map(([k,r]) =>
      `<button class="role" data-role="${k}"><b>${r.label}</b><span>${r.desc}</span></button>`).join('') +
    `</div></div>`);
  app.querySelectorAll('.role').forEach(b => b.onclick = () => {
    state.role = b.dataset.role;
    state.dirty = true; saveLocal(false);
    clearTimeout(state.timer); state.timer = setTimeout(saveRemote, 500);
    renderForm();
  });
}

/* ===================== عرض المهمة ===================== */
const ICONS = {
  instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
  drive:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'
};

// يعزل المقاطع اللاتينية داخل النص العربي كي لا تختلّ بنية الجملة (مثل: «(Fundraising – FR)»)
function rich(text, rtl){
  if(!rtl) return esc(text);
  const re = /\([A-Za-z][^()]*\)|[A-Za-z][A-Za-z0-9.\-]*(?: [A-Za-z0-9.\-]+)*/g;
  let out = '', last = 0, m;
  while((m = re.exec(text))){
    out += esc(text.slice(last, m.index)) + '<bdi class="en">' + esc(m[0]) + '</bdi>';
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

function blockHtml(b, rtl){
  if(b.t === 'h') return `<h3>${rich(b.text, rtl)}</h3>`;
  if(b.t === 'p') return `<p>${rich(b.text, rtl)}</p>`;
  if(b.t === 'ul' || b.t === 'ol') return `<${b.t}>` + b.items.map(i => `<li>${rich(i, rtl)}</li>`).join('') + `</${b.t}>`;
  if(b.t === 'img') return `<figure><img src="${esc(b.src)}" alt="${esc(b.alt || '')}" loading="lazy">${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}</figure>`;
  if(b.t === 'links') return '<div class="iconlinks">' + b.items.map(l => l.url
      ? `<a class="iconlink" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${ICONS[l.kind] || ''}<span>${esc(l.label)}</span></a>`
      : `<span class="iconlink off" title="سيتوفّر قريبًا">${ICONS[l.kind] || ''}<span>${esc(l.label)} (قريبًا)</span></span>`).join('') + '</div>';
  return '';
}

function fieldHtml(f){
  const opt = f.required ? '' : ' <span class="hint" style="display:inline">(اختياري)</span>';
  let h = `<label class="q" for="f_${f.id}">${rich(f.label, true)}${opt}</label>`;
  if(f.hint) h += `<p class="hint">${rich(f.hint, true)}</p>`;
  if(f.logo){
    h += `<p class="hint"><b>مهم:</b> ${rich('أضف شعار IEEE Horus SB وحده في أعلى المستند.', true)}</p>`;
    if(RESOURCES_URL) h += `<div class="iconlinks" style="margin:0 0 10px"><a class="iconlink" href="${esc(RESOURCES_URL)}" target="_blank" rel="noopener noreferrer">${ICONS.drive}<span>شعار IEEE Horus SB (مجلد المصادر)</span></a></div>`;
  }
  if(f.type === 'text'){
    h += `<textarea id="f_${f.id}" rows="${f.rows || 4}" maxlength="3000"></textarea>`;
    if(f.min) h += `<div class="count" id="c_${f.id}">0 / ${f.min} حرفًا على الأقل</div>`;
  }else if(f.type === 'line'){
    h += `<input type="text" id="f_${f.id}" maxlength="120">`;
  }else{
    h += `<input type="url" id="f_${f.id}" placeholder="https://" dir="ltr" autocomplete="off">`;
  }
  return h;
}

function sectionsOf(){
  return state.info.committee === 'social' ? SOCIAL_ROLES[state.role].sections : COMMITTEES[state.info.committee].sections;
}

function renderForm(){
  const social = state.info.committee === 'social';
  const sections = sectionsOf();
  state.fields = sections.reduce((all, s) => all.concat(s.fields), []);
  const back = social ? '<p><button type="button" class="link" id="back">← تغيير التخصص</button></p>' : '';
  const roleBadge = social ? ` — ${esc(SOCIAL_ROLES[state.role].label)}` : '';
  const body = sections.map(s =>
    (s.blocks && s.blocks.length ? `<div class="brief" dir="${s.dir || 'rtl'}">${s.blocks.map(b => blockHtml(b, (s.dir || 'rtl') !== 'ltr')).join('')}</div>` : '') +
    s.fields.map(fieldHtml).join('')).join('');
  show(intro() + `<form class="card" id="form" novalidate>${back}
    <h2>المهمة${roleBadge}</h2>${body}
    <label class="decl"><input type="checkbox" id="decl"><span>أُقرّ بأن الإجابات والأعمال المرفقة من إنجازي أنا، وأنني استعنت بالذكاء الاصطناعي (إن فعلت) مصدرًا للأفكار فقط.</span></label>
    <div class="err" id="err"></div>
    <button class="btn" type="submit" id="send">إرسال المهمة</button></form>`);
  if(document.getElementById('back')) document.getElementById('back').onclick = () => { collectValues(); renderRoles(); };

  // استعادة القيم المحفوظة وربط الحفظ التلقائي
  state.pasteCount = 0; state.pasteChars = 0;
  state.fields.forEach(f => {
    const el = document.getElementById('f_' + f.id);
    if(state.values[f.id]) el.value = state.values[f.id];
    const counter = document.getElementById('c_' + f.id);
    const upd = () => { if(counter) counter.textContent = `${el.value.trim().length} / ${f.min} حرفًا على الأقل`; };
    upd();
    el.addEventListener('input', () => { upd(); onEdit(); });
    if(f.type === 'text'){
      el.addEventListener('paste', e => {
        state.pasteCount++;
        state.pasteChars += ((e.clipboardData || window.clipboardData).getData('text') || '').length;
      });
    }
  });
  document.getElementById('form').onsubmit = submit;
}

/* ===================== التحقق والإرسال ===================== */
function checkLink(val, hostsKey){
  let u;
  try{ u = new URL(val); }catch(e){ return 'الرابط غير صالح. يجب أن يبدأ بـ https://'; }
  if(u.protocol !== 'https:') return 'يجب أن يبدأ الرابط بـ https://';
  const h = u.hostname.toLowerCase();
  const ok = HOSTS[hostsKey].some(x => h === x || h.endsWith('.' + x));
  return ok ? '' : HOST_MSG[hostsKey];
}

function fail(t){ const e = document.getElementById('err'); e.textContent = t; e.scrollIntoView({behavior:'smooth',block:'center'}); }

async function submit(ev){
  ev.preventDefault();
  if(state.submitting) return;
  document.getElementById('err').textContent = '';
  const answers = [];
  for(const f of state.fields){
    const val = document.getElementById('f_' + f.id).value.trim();
    if(!val){
      if(f.required) return fail(`«${f.label}» — هذا الحقل مطلوب.`);
      continue;
    }
    if(f.type === 'link'){
      const err = checkLink(val, f.hosts);
      if(err) return fail(`«${f.label}» — ${err}`);
    }else if(f.min && val.length < f.min){
      return fail(`«${f.label}» — اكتب ${f.min} حرفًا على الأقل.`);
    }
    answers.push({id:f.id, label:f.label, value:val});
  }
  if(!document.getElementById('decl').checked) return fail('يجب الموافقة على الإقرار قبل الإرسال.');
  if(!confirm('بعد الإرسال لا يمكن تعديل إجابتك ولا إرسال إجابة أخرى. هل أنت متأكد من الإرسال؟')) return;

  state.submitting = true; clearTimeout(state.timer);
  const btn = document.getElementById('send'); btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
  try{
    const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'submit', code:state.code, role:state.role, answers, declaration:true,
        meta:{pasteCount:state.pasteCount, pasteChars:state.pasteChars}})});
    const res = await r.json();
    if(res.ok){ clearLocal(); return msg('🎉','تم إرسال مهمتك','شكرًا لك! سنراجع المهام ونتواصل معك.','ok'); }
    if(res.error === 'already'){ clearLocal(); return msg('✅','تم استلام مهمتك مسبقًا','لا يمكن إرسال أكثر من إجابة واحدة.','ok'); }
    if(res.error === 'link') fail('أحد الروابط غير صالح. تأكّد من أنه رابط Google Drive (أو Behance للأعمال السابقة، أو نموذج Google Forms / Microsoft Forms).');
    else if(res.error === 'incomplete') fail('بعض الحقول المطلوبة ناقصة، يرجى مراجعة الإجابات.');
    else fail('حدثت مشكلة أثناء الإرسال، يرجى المحاولة مرة أخرى.');
  }catch(e){ fail('تعذّر الاتصال، تأكّد من الإنترنت ثم حاول مرة أخرى.'); }
  state.submitting = false; btn.disabled = false; btn.textContent = 'إرسال المهمة';
}

init();
</script>
